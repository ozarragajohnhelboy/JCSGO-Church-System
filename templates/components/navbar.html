{% load static %}
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'churches:dashboard' %}">
      <img src="{% static 'image/JCSGO_logo.png' %}" alt="JCSGO Logo" class="navbar-logo me-2" />
      <span class="brand-text">JCSGO CMS</span>
    </a>

    <div class="navbar-profile">
      <ul class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <div class="me-2">
              {% if user.profile_picture %}
                <img src="{{ user.profile_picture.url }}" alt="Profile" class="rounded-circle" width="32" height="32" />
              {% else %}
                <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                  <i class="bi bi-person text-white"></i>
                </div>
              {% endif %}
            </div>
            <span class="user-name">{{ user.full_name }}</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0">
            <li class="dropdown-header">
              <div class="d-flex align-items-center">
                <div class="me-3">
                  {% if user.profile_picture %}
                    <img src="{{ user.profile_picture.url }}" alt="Profile" class="rounded-circle" width="40" height="40" />
                  {% else %}
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                      <i class="bi bi-person text-white"></i>
                    </div>
                  {% endif %}
                </div>
                <div>
                  <div class="fw-bold">{{ user.full_name }}</div>
                  <small class="text-muted">{{ user.role.get_name_display }}</small>
                </div>
              </div>
            </li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center" href="{% url 'members:user_profile' %}"><i class="bi bi-person me-2"></i> Profile</a>
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center" href="#"><i class="bi bi-gear me-2"></i> Settings</a>
            </li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li>
              <form method="post" action="{% url 'churches:custom_logout' %}" id="logout-form" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="dropdown-item d-flex align-items-center text-danger" style="border: none; background: none; width: 100%; text-align: left; cursor: pointer;">
                  <i class="bi bi-box-arrow-right me-2"></i> Sign Out
                </button>
              </form>
            </li>
            <script>
              document.getElementById('logout-form').addEventListener('submit', function(e) {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.ready.then(function(registration) {
                    if (registration.active) {
                      registration.active.postMessage({ type: 'CLEAR_CACHE' });
                    }
                  });
                }
              });
            </script>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
