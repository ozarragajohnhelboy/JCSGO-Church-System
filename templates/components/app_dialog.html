<div class="modal fade" id="appDialog" tabindex="-1" aria-labelledby="appDialogTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content app-dialog">
      <div class="modal-header">
        <h5 class="modal-title" id="appDialogTitle">Confirm</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" id="appDialogMessage"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="appDialogCancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="appDialogConfirm">OK</button>
      </div>
    </div>
  </div>
</div>
