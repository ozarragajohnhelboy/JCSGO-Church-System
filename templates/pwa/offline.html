{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - JCSGO Church</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="text-center">
            <img src="{% static 'image/JCSGO_logo.png' %}" alt="JCSGO Logo" class="mb-4" style="max-width: 200px;">
            <h1 class="mb-3">No Internet Connection</h1>
            <p class="text-muted mb-4">Please check your internet connection and try again.</p>
            <button onclick="window.location.reload()" class="btn btn-primary">
                Try Again
            </button>
        </div>
    </div>
</body>
</html>
