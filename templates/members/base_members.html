{% extends 'base.html' %}
{% load static %}

{% block title %}Member Management - {{ block.super }}{% endblock %}

{% block extra_css %}
<style>
    .sidebar {
        min-height: calc(100vh - 56px);
        background-color: #f8f9fa;
        border-right: 1px solid #dee2e6;
    }
    
    .sidebar .nav-link {
        color: #495057;
        padding: 0.75rem 1rem;
        border-radius: 0.25rem;
        margin: 0.25rem 0;
    }
    
    .sidebar .nav-link:hover {
        background-color: #e9ecef;
        color: #212529;
    }
    
    .sidebar .nav-link.active {
        background-color: #007bff;
        color: white;
    }
    
    .content-area {
        padding: 2rem;
    }
    
    .stats-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 15px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }
    
    .stats-card h3 {
        margin: 0;
        font-size: 2rem;
        font-weight: bold;
    }
    
    .stats-card p {
        margin: 0;
        opacity: 0.9;
    }
    
    .search-form {
        background-color: #f8f9fa;
        padding: 1.5rem;
        border-radius: 10px;
        margin-bottom: 2rem;
    }
    
    .table-responsive {
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    
    .btn-action {
        margin: 0 0.25rem;
    }
</style>
{% endblock %}

{% block admin_content %}
<div class="container-fluid">
    <div class="row">
        <!-- Main content -->
        <main class="col-12 px-md-4 content-area">
            {% block members_content %}
            <!-- Content will be overridden by child templates -->
            {% endblock %}
        </main>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Common JavaScript for member management
    $(document).ready(function() {
        // Initialize tooltips
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        });
        
        // Initialize popovers
        var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
        var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
            return new bootstrap.Popover(popoverTriggerEl)
        });
        
        // Common AJAX error handling
        $(document).ajaxError(function(event, xhr, settings, error) {
            if (xhr.status === 403) {
                alert('Permission denied. You do not have access to this resource.');
            } else if (xhr.status === 500) {
                alert('Server error occurred. Please try again later.');
            } else {
                alert('An error occurred: ' + error);
            }
        });
    });
    
    // Common utility functions
    function showLoading(element) {
        $(element).prop('disabled', true).html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Loading...');
    }
    
    function hideLoading(element, originalText) {
        $(element).prop('disabled', false).html(originalText);
    }
    
    function showSuccess(message) {
        // You can implement a toast notification system here
        alert('Success: ' + message);
    }
    
    function showError(message) {
        alert('Error: ' + message);
    }
</script>
{% endblock %}
