{% if user_group and user_group.leader_id != user.id %}
<div class="modal fade" id="leaveGroupModal" tabindex="-1" aria-labelledby="leaveGroupModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content app-dialog">
      <form method="post" action="{% url 'members:group_leave_request' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="leaveGroupModalLabel">Request to leave {{ user_group.name }}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted">Your leader, {{ user_group.leader.full_name }}, must approve this before you leave.</p>
          <label for="leaveReason" class="form-label">Reason</label>
          <textarea id="leaveReason" name="reason" class="form-control" rows="4" minlength="10" maxlength="500" required placeholder="Why do you need to leave this group?"></textarea>
          <div class="form-text">At least 10 characters. Your leader will see this reason.</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-warning">Send request</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endif %}
